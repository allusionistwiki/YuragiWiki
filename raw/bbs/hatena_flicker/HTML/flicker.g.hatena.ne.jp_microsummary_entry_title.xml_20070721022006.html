<?xml version="1.0" encoding="UTF-8"?>
<generator xmlns="http://www.mozilla.org/microsummaries/0.1" name="Hatena Diary/Group Entry Title">
  <template>
    <transform xmlns="http://www.w3.org/1999/XSL/Transform" version="1.0">
      <output method="text"/>
      <template match="/">
        <value-of select="html/head/title"/>
        <choose>
          <when test="boolean(descendant::div[attribute::class='section'][1]/h3)">
            <text> - </text>
            <value-of select="descendant::div[attribute::class='section'][1]/h3"/>
          </when>
          <when test="boolean(descendant::div[attribute::class='day'][1]/h2)">
            <text> - </text>
            <value-of select="descendant::div[attribute::class='day'][1]/h2"/>
          </when>
        </choose>
      </template>
    </transform>
  </template>
  <update interval="240"/>
  <pages>
    <include>^http://d\.hatena\.ne\.jp/[^/]+/$</include>
    <include>^https?://[^\.]+\.g\.hatena\.ne\.jp/[^/]+/$</include>
  </pages>
</generator>
